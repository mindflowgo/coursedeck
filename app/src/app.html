<!doctype html>
<html lang="en" class="h-full bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/vendor/katex/katex.min.css" />
		<script>
			try {
				const theme = localStorage.getItem('app_theme') || 'system';
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (theme === 'system' && prefersDark)) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
				}
			} catch (_) {}
			try {
				// Restore zoom before first paint (desktop app only; browsers use
				// their native zoom). Must mirror isTauriEnvironment() in $lib/api.
				const isTauri =
					'__TAURI_INTERNALS__' in window ||
					location.protocol === 'tauri:' ||
					location.hostname === 'tauri.localhost';
				if (isTauri) {
					const level = parseFloat(localStorage.getItem('course_zoom') || '100');
					if (Number.isFinite(level) && level !== 100 && level >= 50 && level <= 300) {
						document.documentElement.style.zoom = String(level / 100);
					}
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full overflow-hidden bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 font-sans selection:bg-stone-200 dark:selection:bg-stone-800 selection:text-stone-900 dark:selection:text-stone-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
