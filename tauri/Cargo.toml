[package]
name = "ilc-study-tool"
version = "0.1.1"
description = "CourseDeck"
authors = ["Study Team"]
edition = "2021"

[lib]
name = "ilc_study_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
pdfium-render = { version = "0.8", features = ["image", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

# Desktop: devtools, shell integration, deep links, window state.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"

# iOS: PencilKit, barcode scanner, zip bundle sync.
[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-pencilkit = { path = "../../tauri-plugin-pencilkit" }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
