name: CourseDeck

options:
  bundleIdPrefix: com.ilc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CourseDeckCore:
    path: CourseDeckCore
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.7.1
  SwiftCmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.7.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.24.0

targets:
  CourseDeck:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CourseDeck
        excludes:
          - "Resources/Info.plist"
          - "Resources/Prompts"
      - path: CourseDeck/Resources/Prompts
        type: folder
        buildPhase: resources
    dependencies:
      - package: CourseDeckCore
        product: CourseDeckCore
      - package: SwiftMarkdown
        product: Markdown
      - package: SwiftCmark
        product: cmark-gfm
      - package: SwiftSoup
        product: SwiftSoup
      - package: SwiftMath
        product: SwiftMath
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Yams
        product: Yams
      - package: SwiftDraw
        product: SwiftDraw
    settings:
      base:
        PRODUCT_NAME: CourseDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.ilc.coursedeck
        INFOPLIST_FILE: CourseDeck/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SDKROOT: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

  CourseDeckTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CourseDeckTests
        excludes:
          - Fixtures
      - path: CourseDeckTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: CourseDeck
      - package: CourseDeckCore
        product: CourseDeckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilc.coursedeck.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CourseDeck.app/CourseDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CourseDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CourseDeckUITests
    dependencies:
      - target: CourseDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilc.coursedeck.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: CourseDeck

schemes:
  CourseDeck:
    build:
      targets:
        CourseDeck: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CourseDeckTests
        - CourseDeckUITests
      testPlans:
        - path: CourseDeck.xctestplan
          defaultPlan: true
