name: coursedeck-ipad
options:
  bundleIdPrefix: com.rezox
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
schemes:
  coursedeck-ipad_iOS:
    build:
      targets:
        coursedeck-ipad_iOS: all
    run:
      config: release
    archive:
      config: release
    profile:
      config: release
    analyze:
      config: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: CourseDeck
      PRODUCT_BUNDLE_IDENTIFIER: com.rezox.coursedeck
      DEVELOPMENT_TEAM: U5492M2JQ5
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    settings:
      groups: [app]
targets:
  coursedeck-ipad_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: coursedeck-ipad_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: coursedeck-ipad_iOS/Info.plist
      properties:
        NSCameraUsageDescription: CourseDeck needs camera access to scan the desktop sync QR code.
        NSLocalNetworkUsageDescription: CourseDeck connects to your computer on the local network to download and synchronize your courses and notes.
        NSBonjourServices:
          - _http._tcp
          - _bonjour._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpenInPlace: true
        CFBundleShortVersionString: 0.1.1
        CFBundleVersion: "0.1.1"
    entitlements:
      path: coursedeck-ipad_iOS/coursedeck-ipad_iOS.entitlements
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64, x86_64]
        VALID_ARCHS: arm64  x86_64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - framework: Frameworks/pdfium.xcframework
        embed: true
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: PencilKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          mkdir -p "${SRCROOT}/Externals/arm64/${CONFIGURATION}"
          mkdir -p "${SRCROOT}/Externals/x86_64/${CONFIGURATION}"
          CRATE_DIR="${PROJECT_DIR}/../../../tauripad"
          PENCILKIT_DIR="${PROJECT_DIR}/../../../../tauri-plugin-pencilkit"
          LIBAPP="${SRCROOT}/Externals/arm64/${CONFIGURATION}/libapp.a"
          needs_build=0
          if [ ! -d "${PENCILKIT_DIR}" ]; then
            echo "warning: tauri-plugin-pencilkit not found at ${PENCILKIT_DIR}; forcing rebuild"
            needs_build=1
          fi
          if [ "${needs_build}" -eq 0 ] && [ ! -f "${LIBAPP}" ]; then
            needs_build=1
          fi
          if [ "${needs_build}" -eq 0 ]; then
            # Rebuild when any Rust/Swift source, manifest or config is newer than the cached archive
            stale=$(find -L "${CRATE_DIR}/src" "${CRATE_DIR}/Cargo.toml" "${CRATE_DIR}/Cargo.lock" "${CRATE_DIR}/tauri.conf.json" "${CRATE_DIR}/capabilities" "${PENCILKIT_DIR}/src" "${PENCILKIT_DIR}/ios/Sources" "${PENCILKIT_DIR}/build.rs" "${PENCILKIT_DIR}/Cargo.toml" -newer "${LIBAPP}" -print -quit 2>/dev/null)
            if [ -n "${stale}" ]; then
              echo "libapp.a stale (${stale}) - rebuilding Rust/Swift"
              needs_build=1
            fi
          fi
          if [ "${needs_build}" -eq 1 ]; then
            PATH="$HOME/.cargo/bin:$PATH" cargo build --manifest-path "${CRATE_DIR}/Cargo.toml" --target aarch64-apple-ios --release || exit $?
            cp "${CRATE_DIR}/target/aarch64-apple-ios/release/libcoursedeck_ipad_lib.a" "${LIBAPP}"
          else
            echo "libapp.a up to date"
          fi
          cp "${LIBAPP}" "${SRCROOT}/Externals/x86_64/${CONFIGURATION}/libapp.a" 2>/dev/null || true
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
    postBuildScripts:
      - script: |
          if [ -d "${DWARF_DSYM_FOLDER_PATH}" ] && [ -d "${SRCROOT}/Frameworks/pdfium.xcframework/ios-arm64/dSYMs/pdfium.framework.dSYM" ]; then
            echo "Ensuring pdfium.framework.dSYM is copied to ${DWARF_DSYM_FOLDER_PATH}..."
            cp -R "${SRCROOT}/Frameworks/pdfium.xcframework/ios-arm64/dSYMs/pdfium.framework.dSYM" "${DWARF_DSYM_FOLDER_PATH}/" || true
          fi
        name: Copy Framework dSYMs
        basedOnDependencyAnalysis: false
