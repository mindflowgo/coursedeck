[package]
name = "coursedeck-ipad"
version = "0.1.0"
description = "CourseDeck for iPad"
authors = ["Study Team"]
edition = "2021"

[lib]
name = "coursedeck_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-barcode-scanner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
pdfium-render = { version = "0.8", features = ["image", "sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
